name: PoSoccer

# The only workflow of this repo.
#
# every run       -> Python checks: ruff format --check, ruff check, pytest (tests/).
# release webgl-* -> deploy (after the checks): download the release's webgl.zip, stamp the release's
#                    commit into every response as X-Commit -> Azure Static Web App -> confirm the live
#                    X-Commit is that commit, the page is the Unity page and /diag answers.
#
# The WebGL player is built LOCALLY with the exact pinned Unity (Unity cannot be licensed in CI) by
# scripts/publish_webgl.ps1, which runs the EditMode tests first, then builds, zips and publishes the
# zip on a GitHub Release tagged webgl-*. Publishing that release runs the deploy job below.
#
# Re-deploy an existing build: Actions -> PoSoccer -> Run workflow, with its tag
# (empty = the newest webgl-* release).
#
# Repo secret it needs:
#   AZURE_STATIC_WEB_APPS_API_TOKEN   the game's Static Web App deployment token
on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: webgl-* release tag to deploy (empty = newest)
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install "ruff==0.17.6" "pytest>=8"
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest

  deploy:
    needs: python
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'webgl-'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download the WebGL build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
              --jq '[.[] | select(.tagName | startswith("webgl-"))] | sort_by(.createdAt) | last | .tagName')
          fi
          test -n "$TAG" || { echo "No webgl-* release. Run scripts/publish_webgl.ps1 first."; exit 1; }
          echo "Deploying $TAG"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p webgl.zip -D .
          mkdir site && unzip -q webgl.zip -d site
          test -f site/index.html || { echo "webgl.zip of $TAG has no index.html at its root"; exit 1; }
          test -f site/diag.html || { echo "webgl.zip of $TAG has no diag.html"; exit 1; }
          test -f site/staticwebapp.config.json || { echo "webgl.zip of $TAG has no staticwebapp.config.json (.unityweb would 404)"; exit 1; }
          # The commit the build was made from (the release is tagged at it) goes into every response as X-Commit.
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          test -n "$SHA" || { echo "Cannot resolve $TAG to a commit"; exit 1; }
          jq --arg sha "$SHA" '.globalHeaders = ((.globalHeaders // {}) + {"X-Commit": $sha})' site/staticwebapp.config.json > swa.json
          mv swa.json site/staticwebapp.config.json
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      - name: Deploy to Azure Static Web App
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          skip_app_build: true
          skip_api_build: true

      # The page is live, is this build's Unity WebGL page (X-Commit = the release's commit), and /diag answers.
      - name: Check the live X-Commit, page and /diag
        env:
          URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          ver=$(grep -o 'v[0-9]\{6\}<' site/index.html | head -1 | tr -d '<')
          for i in $(seq 1 20); do
            live=$(curl -fsS -o /dev/null -D - --max-time 30 "$URL/" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-commit"{print $2}')
            page=$(curl -fsS --max-time 30 "$URL/" || true)
            if [ "$live" = "$SHA" ] && echo "$page" | grep -q 'loader.js' && echo "$page" | grep -q "$ver"; then
              curl -fsS --max-time 30 "$URL/diag" | grep -q 'System status' || { echo "$URL/diag is not the status page"; exit 1; }
              echo "Live: $URL ($ver) at X-Commit $live; /diag answers"; exit 0
            fi
            echo "waiting: X-Commit '$live', want $SHA"
            sleep 15
          done
          echo "$URL did not serve this build (X-Commit $SHA, $ver)"; exit 1
