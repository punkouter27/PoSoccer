# p38 / NICK - from scratch, scheduled soccer curriculum (2026-11-07).
#
# WHY. NICK's deployed brain is soccer_p31_nick (26.9% against bot v1, n=350). The p31
# checkpoints are not on this machine (no results/), and AGENTS.md now says every
# character trains its own brain from scratch, so this starts from nothing.
#
# WHAT CHANGES AGAINST p31 (two things; read the grade with that in mind):
#  1. The bot_strength ladder advances on TRAINING PROGRESS, not on reward. p31's ladder
#     was reward-gated and stalled (NICK stopped at Lesson4_Strong); the history has four runs that never
#     promoted at all (p17, p18, p20). A progress schedule always reaches the full-strength
#     bot, and spends the second half there - which is what took STANDARD over the bar
#     (p34control -> p37bot, bot-only at full strength).
#  2. 30M steps instead of 10M. STANDARD needed its own lineage plus 40M more.
#
# THE CURRICULUM (item 44: reach the ball, dribble, shoot, then play the bot). The knob is
# the existing bot_strength (Agent_HeuristicBot scales drive, turn and boost by it, and
# disables support play below 0.5 and finishing below 0.8). At 0.0 its drive, turn and
# boost are scaled to zero: that lesson is the drill - reach the ball, carry it past a
# standing body, score. (Read from the code, not yet watched in a run.)
#   progress 0.00-0.05  0.00  drill: static opponent
#   progress 0.05-0.10  0.20  feeble
#   progress 0.10-0.15  0.35
#   progress 0.15-0.20  0.50  bot starts supporting/positioning
#   progress 0.20-0.30  0.65
#   progress 0.30-0.50  0.80  bot starts finishing
#   progress 0.50-1.00  1.00  the graded opponent
# goal_width stays 6.0 (the graded width): one curriculum at a time.
#
# Launch (all three in parallel, from scratch):
#   .\scripts\train-parallel.ps1 -Tag p38 -Profiles MATT,KIM,NICK
# Grade:
#   .\scripts\evaluate.ps1 -RunId soccer_p38_nick -Profile NICK -Episodes 1000
# plus Agent_PlayMode_MovementProbe (blue trained side) before any win-rate theory.
# Check on TensorBoard: Environment/Lesson Number.bot_strength climbs on schedule;
# Reward/turn_churn reads 0.
behaviors:
  NICK:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 8.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 30000000
    time_horizon: 1024
    summary_freq: 50000
    keep_checkpoints: 20
    checkpoint_interval: 1000000

environment_parameters:
  goal_width: 6.0

  bot_strength:
    curriculum:
      - name: Lesson0_Drill
        completion_criteria:
          measure: progress
          behavior: NICK
          min_lesson_length: 100
          threshold: 0.05
        value: 0.0
      - name: Lesson1_Feeble
        completion_criteria:
          measure: progress
          behavior: NICK
          min_lesson_length: 100
          threshold: 0.1
        value: 0.2
      - name: Lesson2_Weak
        completion_criteria:
          measure: progress
          behavior: NICK
          min_lesson_length: 100
          threshold: 0.15
        value: 0.35
      - name: Lesson3_Half
        completion_criteria:
          measure: progress
          behavior: NICK
          min_lesson_length: 100
          threshold: 0.2
        value: 0.5
      - name: Lesson4_Capable
        completion_criteria:
          measure: progress
          behavior: NICK
          min_lesson_length: 100
          threshold: 0.3
        value: 0.65
      - name: Lesson5_Strong
        completion_criteria:
          measure: progress
          behavior: NICK
          min_lesson_length: 100
          threshold: 0.5
        value: 0.8
      - name: Lesson6_Full
        value: 1.0

env_settings:
  num_envs: 4

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
