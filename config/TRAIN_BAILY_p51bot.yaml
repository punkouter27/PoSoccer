# p51bot / BAILY - 10M against bot v1 at full strength, continuing BAILY's own p50 (2026-11-08).
# Same recipe as p39bot, which took MATT/KIM/NICK past the 80% / 10% bar. Initialised from
# soccer_p50_baily only - never another profile's brain (AGENTS.md).
behaviors:
  BAILY:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 8.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 10000000
    time_horizon: 1024
    summary_freq: 50000
    keep_checkpoints: 20
    checkpoint_interval: 1000000

environment_parameters:
  goal_width: 6.0
  bot_strength: 1.0

env_settings:
  num_envs: 4

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
