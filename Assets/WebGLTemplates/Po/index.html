<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0f17">
    <link rel="icon" href="data:,">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      /* PoSoccer's page. The chrome is drawn ONCE, here, outside the canvas, so it can never
         sit on the game's HUD: a 44px top bar (name; fullscreen and /diag on the right) and a
         20px footer carrying the build stamp vYYMMDD. The canvas fills everything between
         them at any aspect - landscape desktop or portrait phone; the game's UI Toolkit panel
         scales with the screen (Expand) and the camera frames the pitch for the aspect. */
      :root { --bg: #0b0f17; --surface: #121826; --line: #232c3f; --text: #e6e9f2; --muted: #9aa3b5; --accent: #6366f1; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--text);
                   font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
      body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
      .po-bar { flex: 0 0 44px; height: 44px; display: flex; align-items: center; justify-content: space-between;
                padding: 0 8px 0 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
      .po-brand { font-weight: 600; font-size: 15px; letter-spacing: 0.02em; color: var(--text); text-decoration: none; }
      .po-actions { display: flex; gap: 6px; }
      .po-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: 8px;
                border: 1px solid var(--line); background: transparent; color: var(--text); text-decoration: none;
                font: 16px/1 system-ui, sans-serif; cursor: pointer; padding: 0; }
      .po-btn:hover, .po-btn:focus-visible { border-color: var(--accent); outline: none; }
      #frame { position: relative; flex: 1 1 auto; min-height: 0; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: var(--bg); outline: none; touch-action: none; }
      .po-foot { flex: 0 0 20px; height: 20px; display: flex; align-items: center; justify-content: flex-end;
                 padding: 0 10px; font-size: 11px; color: var(--muted); background: var(--bg); }
      #loading { position: absolute; inset: 0; display: flex; flex-direction: column;
                 align-items: center; justify-content: center; gap: 14px;
                 font: 600 14px/1 Inter, system-ui, sans-serif; letter-spacing: 0.12em; color: var(--text); }
      #bar { width: min(60%, 420px); height: 6px; border-radius: 3px; background: var(--surface); overflow: hidden; }
      #fill { width: 0; height: 100%; background: var(--accent); }
      #error { position: absolute; left: 8%; right: 8%; bottom: 8%; display: none;
               padding: 12px; border-radius: 6px; background: #5a1a1a; color: #fff;
               font: 13px/1.4 system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <header class="po-bar">
      <a class="po-brand" href="/">{{{ PRODUCT_NAME }}}</a>
      <div class="po-actions">
        <button class="po-btn" id="fullscreen" type="button" tabindex="-1" aria-label="Fullscreen" title="Fullscreen">⛶</button>
        <a class="po-btn" href="/diag" tabindex="-1" aria-label="System status" title="System status (/diag)">⚙</a>
      </div>
    </header>
    <div id="frame">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading"><div>{{{ PRODUCT_NAME }}}</div><div id="bar"><div id="fill"></div></div></div>
      <div id="error"></div>
    </div>
    <footer class="po-foot"><span class="po-version">v{{{ PRODUCT_VERSION }}}</span></footer>
    <script>
      var canvas = document.getElementById("unity-canvas");
      var loading = document.getElementById("loading");
      var fill = document.getElementById("fill");
      var errorBox = document.getElementById("error");

      // Tab is the game's diagnostics key. Without this the browser moves focus off the
      // canvas instead (the event still reaches Unity: no stopPropagation).
      window.addEventListener("keydown", function (e) { if (e.key === "Tab") e.preventDefault(); });

      document.getElementById("fullscreen").addEventListener("click", function () {
        var el = document.documentElement;
        if (document.fullscreenElement) document.exitFullscreen();
        else if (el.requestFullscreen) el.requestFullscreen();
        canvas.focus();
      });

      function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = "block";
      }

      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // Sharp on high-DPI phones without paying for 3x.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: function (message, type) {
          if (type === "error") {
            showError(message);
          }
        },
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = (100 * progress) + "%";
        }).then(function () {
          loading.style.display = "none";
          canvas.focus();
        }).catch(function (message) {
          showError(String(message));
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
